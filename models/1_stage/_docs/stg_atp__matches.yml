---
version: 2
models:
  - name: stg_atp__matches
    description: >
      All ATP Tour level matches from 1968 to 2024. Each row is a unique match. Data collected by Jeff Sackman here: https://github.com/JeffSackmann/tennis_atp
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - tournament_id
            - tournament_name
            - match_id
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          compare_model: source('atp_tour_raw', 'matches')
    columns:
      - name: match_sk
        data_tests:
          - unique
      - name: tournament_id
        data_tests: 
          - not_null
